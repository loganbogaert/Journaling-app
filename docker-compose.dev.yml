services:
  keycloak-db:
    environment:
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-changeme}

  keycloak:
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-changeme}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-changeme}

  backend:
    entrypoint: ["/bin/sh", "-c"]
    command:
      - npx sequelize-cli db:migrate && npx sequelize-cli db:seed:all && exec npm run dev
    environment:
      KONG_GATEWAY_SECRET: ${KONG_GATEWAY_SECRET:-local-development-gateway-secret}
    volumes:
      - ./Backend:/app
      - backend_node_modules:/app/node_modules

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.dev
    command: npm start -- --host 0.0.0.0 --poll=1000 --proxy-config proxy.conf.json
    ports:
      - "4200:4200"
    volumes:
      - ./Frontend:/app
      - frontend_node_modules:/app/node_modules

  kong:
    environment:
      KONG_GATEWAY_SECRET: ${KONG_GATEWAY_SECRET:-local-development-gateway-secret}

volumes:
  backend_node_modules:
  frontend_node_modules:
