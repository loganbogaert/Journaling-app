server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API/auth/object-storage traffic is routed by Kong (see kong/kong.yml), not this
    # container — Kong sits in front of this service and proxies /api, /auth and /minio
    # to the backend, Keycloak and MinIO respectively.

    # Handle Angular HTML5 pushState routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-term cache for hashed static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
