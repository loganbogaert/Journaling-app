<div class="page">
  <header class="page-header">
    <h1>Dashboard</h1>
    <div class="actions">
      <a routerLink="/settings/screenshots" class="btn-secondary">Chart settings</a>
      <a routerLink="/accounts/new" class="btn-primary">+ New Account</a>
    </div>
  </header>

  <p *ngIf="loading">Loading…</p>
  <p class="error" *ngIf="error">{{ error }}</p>

  <div class="account-grid" *ngIf="!loading && !error">
    <app-account-card
      *ngFor="let account of accounts"
      [account]="account">
    </app-account-card>
    <p *ngIf="accounts.length === 0">No accounts yet. Create your first one!</p>
  </div>
</div>
