services:
  postgres:
    image: postgres:16-alpine
    container_name: trading_journal_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: trading_journal_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: "http://localhost:8000/minio"
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 \${MINIO_ROOT_USER} \${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb myminio/\${MINIO_BUCKET};
      /usr/bin/mc policy set public myminio/\${MINIO_BUCKET};
      exit 0;
      "

  keycloak-db:
    image: postgres:16-alpine
    container_name: trading_journal_keycloak_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: trading_journal_keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY: edge
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy

  trade-api:
    build:
      context: .
      dockerfile: trade-api/Dockerfile
    container_name: trading_journal_trade_api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
      PORT: 3000
      BROKER_SYNC_API_URL: http://broker-sync-api:4000
      INTERNAL_PORT: 3001
      INTERNAL_HOST: 0.0.0.0
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DIALECT: postgres
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_ENDPOINT: localhost
      MINIO_PUBLIC_PORT: 8000
      KEYCLOAK_URL: http://keycloak:8080/auth
      KEYCLOAK_ISSUER_URL: http://localhost:8000/auth
      KEYCLOAK_REALM: trading-journal
      KONG_GATEWAY_SECRET: ${KONG_GATEWAY_SECRET}
    expose:
      - "3001"
    depends_on:
      broker-sync-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  broker-sync-api:
    build:
      context: .
      dockerfile: broker-sync-api/Dockerfile
    container_name: trading_journal_broker_sync_api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PORT: 4000
      BROKER_SYNC_CLIENT_SECRET: ${BROKER_SYNC_CLIENT_SECRET}
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      KEYCLOAK_URL: http://keycloak:8080/auth
      KEYCLOAK_ISSUER_URL: http://localhost:8000/auth
      KEYCLOAK_REALM: trading-journal
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: trading_journal_frontend
    restart: unless-stopped
    environment:
      # Public-facing Keycloak config, injected into window.__env at container startup
      # (see Frontend/docker-entrypoint.d/40-generate-env.sh) — never baked into the build.
      KEYCLOAK_URL: /auth
      KEYCLOAK_REALM: trading-journal
      KEYCLOAK_CLIENT_ID: trading-journal-frontend
    depends_on:
      - trade-api

  kong:
    image: kong:3.6
    container_name: trading_journal_kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      # Makes the env var visible to os.getenv() in Lua plugins (pre-function below)
      KONG_NGINX_MAIN_ENV: KONG_GATEWAY_SECRET
      KONG_GATEWAY_SECRET: ${KONG_GATEWAY_SECRET}
      # pre-function's Lua sandbox blocks os.* by default; this config is authored by us
      # (not untrusted user input), so it's safe to lift that restriction here.
      KONG_UNTRUSTED_LUA: "on"
    volumes:
      - ./kong/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "8000:8000"
      - "8443:8443"
    depends_on:
      - frontend
      - trade-api
      - broker-sync-api
      - keycloak
      - minio

volumes:
  postgres_data:
  minio_data:
  keycloak_db_data:
